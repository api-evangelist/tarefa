name: Tarefa
description: >-
  Tarefa (tarefa.co) is an online study companion — "tu compañero de estudio" —
  for Spanish-speaking university and high-school students, offering structured
  learning paths, solved exercises ("ejercicios resueltos"), video tutorials, and
  practice materials across mathematics (calculus, differential equations,
  probability and statistics, numerical methods), physics (electromagnetism,
  Newtonian mechanics, energy), and chemistry (inorganic, organic, gas laws,
  atomic structure, electrochemistry). It is a subscription-based B2C EdTech
  platform backed by 500 Global. Tarefa exposes no public developer API or
  documentation at this time; this profile captures its public web surface and
  domain-security posture for the API Evangelist network.
